<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                width: 260px;
                padding: 16px;
                font-family: Arial, sans-serif;
                background: #1a1a2e;
                color: #eee;
                margin: 0;
            }
            .h1 {
                font-size: 15px;
                margin: 0 0 12px;
                text-align: center;
            }
            .toggle-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 8px 0;
            }
            .toggle-label {
                font-size: 13px;
            }
            .switch {
                position: relative;
                width: 42px;
                height: 24px;
            }
            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }
            .slider {
                position: absolute;
                inset: 0;
                background: #555;
                border-radius: 24px;
                cursor: pointer;
                transition: background 0.2s;
            }
            .slider::before {
                content: "";
                position: absolute;
                width: 18px;
                height: 18px;
                left: 3px;
                top: 3px;
                background: #fff;
                border-radius: 50%;
                transition: transform 0.2s;
            }
            .switch input:checked + .slider {
                background: #e53935;
            }
            .switch input:checked + .slider::before {
                transform: translateX(18px);
            }
            .status {
                text-align: center;
                margin-top: 12px;
                font-size: 12px;
                color: #aaa;
            }
        </style>
    </head>
<body>
    <h1>YouTube Chat Blocker</h1>
    <div class="toggle-row">
        <span class="toggle-label">Enable Chat Blocking</span>
        <label class="switch">
            <input type="checkbox" id="toggle" />
            <span class="slider"></span>
        </label>
    </div>
    <p class="status" id="status">Inactive</p>
    <script src="popup.js"></script>
</body>
</html>
